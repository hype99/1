<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cric Hype | Live Sports</title>
    <style>
        :root {
            --primary: #3b82f6;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: white;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Header & Live Badge --- */
        header {
            width: 100%;
            padding: 15px 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .live-badge {
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: live-blink 1.2s infinite;
        }

        @keyframes live-blink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- Layout --- */
        .main-container {
            width: 95%;
            max-width: 900px;
            margin: 25px auto;
        }

        .video-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        #iframe-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- Quality Controls --- */
        .section-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            margin: 30px 0 15px;
            text-align: center;
        }

        .quality-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 14px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }

        .active {
            background: rgba(59, 130, 246, 0.2) !important;
            border: 1px solid var(--primary) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        /* --- Footer Button --- */
        .footer-action {
            margin: 40px 0;
            text-align: center;
        }

        .tg-link {
            background: #24A1DE;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .tg-link:hover {
            transform: scale(1.03);
        }

        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">Cric Hype</div>
            <div class="live-badge">
                <span class="live-dot"></span>
                LIVE
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="video-wrapper">
            <div id="iframe-container"></div>
        </div>

        <div class="section-label">Switch Channel</div>
        <div class="quality-grid" id="qualityList">
            <div class="btn" data-res="Tamil HD">Tamil HD</div>
            <div class="btn" data-res="Telugu HD">Telugu HD</div>
            <div class="btn" data-res="Tamil SD">Tamil SD</div>
            <div class="btn" data-res="Telugu SD">Telugu SD</div>
        </div>

        <div class="footer-action">
            <a href="https://telegram.me/+89_DpZx6uUs2Mjk9" class="tg-link">Join Telegram for More Links</a>
        </div>
    </div>

    <script>
        const streams = {
            "Tamil HD": "https://cricfreehd.pages.dev/4?id=1TAHD",
            "Telugu HD": "https://cricfreehd.pages.dev/4?id=1TEHD",
            "Tamil SD": "https://cricfreehd.pages.dev/4?id=1TASD",
            "Telugu SD": "https://cricfreehd.pages.dev/4?id=1TESD",
            "Kannada HD": "https://tataplay.slivcdn.com/hls/live/2011747/TEN1HD/master_3500.m3u8"
        };

        function playStream(res) {
            const url = streams[res];
            if (url) {
                const container = document.getElementById('iframe-container');
                
                // Create iframe with all necessary permissions
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.allowFullscreen = true;
                iframe.scrolling = "no";
                
                // Essential permissions for modern players (Autoplay, Encrypted Media, Fullscreen)
                iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
                
                // Clear and append
                container.innerHTML = '';
                container.appendChild(iframe);
                
                // Update button states
                document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                const activeBtn = document.querySelector(`[data-res="${res}"]`);
                if(activeBtn) activeBtn.classList.add('active');
            }
        }

        document.getElementById('qualityList').addEventListener('click', (e) => {
            const res = e.target.getAttribute('data-res');
            if (res) playStream(res);
        });

        // Load initial stream
        window.onload = () => playStream('Tamil HD');
    </script>
</body>
</html>
