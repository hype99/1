<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>@Cricinsider365</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.compiled.js"></script>

<style>

body{
margin:0;
background:#000;
font-family:system-ui;
color:white;
}

.player-container{
position:relative;
width:100%;
height:100vh;
background:#000;
}

video{
width:100%;
height:100%;
}

.logo{
position:absolute;
top:15px;
right:15px;
width:70px;
opacity:.8;
z-index:10;
}

.quality-bar{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
background:rgba(0,0,0,.7);
padding:8px 12px;
border-radius:30px;
z-index:20;
}

.qbtn{
background:#111;
border:1px solid #333;
color:white;
padding:6px 12px;
border-radius:20px;
font-size:12px;
cursor:pointer;
}

.qbtn.active{
background:red;
}

.loader{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:12px 20px;
border-radius:20px;
}

</style>
</head>

<body>

<div class="player-container">

<div id="qualities" class="quality-bar"></div>

<div id="loader" class="loader">Loading stream...</div>

<video id="video" autoplay muted playsinline></video>

<img class="logo" src="https://i.postimg.cc/fRSw4ZRD/IMG-20250925-223757.jpg">

</div>

<script>

const API="https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json";

const params=new URLSearchParams(location.search);
const matchId=params.get("id");

const video=document.getElementById("video");
const qualities=document.getElementById("qualities");
const loader=document.getElementById("loader");

let player;

async function init(){

const res=await fetch(API);
const data=await res.json();

const match=data.matches.find(m=>m.match_id==matchId);

if(!match){
loader.innerText="Stream not found";
return;
}

const playlist=match.auto_streams?.[0]?.auto;

const lines=playlist.split("\n");

let streams=[];

lines.forEach((line,i)=>{

if(line.includes("RESOLUTION=")){

const q=line.split("RESOLUTION=")[1].split(",")[0].split("x")[1]+"p";

const url=lines[i+1].trim();

streams.push({q,url});

}

});

buildButtons(streams);

loadStream(streams[0].url);

}

function buildButtons(streams){

streams.reverse().forEach((s,i)=>{

const btn=document.createElement("div");

btn.className="qbtn";

btn.innerText=s.q;

if(i==0) btn.classList.add("active");

btn.onclick=()=>{

document.querySelectorAll(".qbtn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

loadStream(s.url);

};

qualities.appendChild(btn);

});

}

async function loadStream(url){

loader.style.display="block";

if(player){
player.destroy();
}

player=new shaka.Player(video);

try{

await player.load(url);

loader.style.display="none";

video.play();

}catch(e){

loader.innerText="Stream failed";

}

}

init();

</script>

</body>
</html>
