*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;width:100%;height:100%;font-family:system-ui,sans-serif;color:#fff}

/* Quality Screen */
#quality-screen{
position:fixed;inset:0;
background:linear-gradient(135deg,#0a0f1c 0%,#131d2f 100%);
display:flex;flex-direction:column;
align-items:center;justify-content:center;
z-index:9999;padding:20px;
}
#quality-screen.hidden{display:none}

.qs-header{text-align:center;margin-bottom:32px}
.qs-logo{
display:inline-flex;align-items:center;gap:10px;
background:rgba(255,255,255,.06);
border:1px solid rgba(59,130,246,.3);
padding:10px 24px;border-radius:50px;
font-size:18px;font-weight:900;
margin-bottom:16px;
}
.qs-title{font-size:15px;font-weight:700;color:#e2e8f0}
.qs-tournament{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:2px;margin-top:4px}

.qs-list{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}

.qs-btn{
background:#131d2f;
border:1px solid #253247;
border-radius:16px;
padding:16px 20px;
display:flex;align-items:center;justify-content:space-between;
cursor:pointer;
font-size:15px;font-weight:700;
}

.qs-btn:hover{background:#1e3a5f;border-color:#3b82f6}

.badge{background:#2563eb;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px}
.badge.hd{background:#16a34a}
.badge.fhd{background:#9333ea}

#player-screen{position:fixed;inset:0;background:#000;display:none}
#player-screen.visible{display:block}

.video-container{position:absolute;width:100%;height:100%;background:#000}

video{width:100%;height:100%}

#myLogo{
width:60px;height:40px;
position:absolute;right:5px;top:10px;
z-index:100;opacity:.8;
}

#back-btn{
position:absolute;top:16px;left:16px;
background:rgba(0,0,0,.7);
border:1px solid rgba(255,255,255,.2);
color:#fff;
padding:8px 18px;border-radius:30px;
font-size:13px;font-weight:700;
cursor:pointer;
display:none;
}

#back-btn.visible{display:flex}
</style>
