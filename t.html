<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>@Cricinsider365 – Player</title>
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#000;width:100%;height:100%;font-family:system-ui,sans-serif;color:#fff}

    /* Quality Screen */
    #quality-screen{
      position:fixed;inset:0;
      background:linear-gradient(135deg,#0a0f1c 0%,#131d2f 100%);
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      z-index:9999;padding:20px;
    }
    #quality-screen.hidden{display:none}
    .qs-header{text-align:center;margin-bottom:32px}
    .qs-logo{
      display:inline-flex;align-items:center;gap:10px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(59,130,246,.3);
      padding:10px 24px;border-radius:50px;
      font-size:18px;font-weight:900;letter-spacing:.5px;
      margin-bottom:16px;
    }
    .qs-title{font-size:15px;font-weight:700;color:#e2e8f0;max-width:320px;line-height:1.4}
    .qs-tournament{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:2px;margin-top:4px}
    .qs-list{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
    .qs-btn{
      background:#131d2f;border:1px solid #253247;border-radius:16px;
      padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
      cursor:pointer;transition:.25s;font-size:15px;font-weight:700;
    }
    .qs-btn:hover{background:#1e3a5f;border-color:#3b82f6;transform:translateX(4px)}
    .qs-btn .badge{background:#2563eb;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;letter-spacing:.5px}
    .qs-btn .badge.hd{background:#16a34a}
    .qs-btn .badge.fhd{background:#9333ea}
    .qs-loading{text-align:center;color:#64748b;font-size:14px;margin-top:20px}
    .qs-error{color:#ef4444;text-align:center;font-size:14px;max-width:320px}

    /* Player Screen */
    #player-screen{position:fixed;inset:0;background:#000;display:none}
    #player-screen.visible{display:block}
    .video-container{position:absolute;width:100%;height:100%;background:#000;overflow:hidden}
    .shaka-video-container{position:absolute;width:100%;height:100%}
    video{width:100%;height:100%;background:#000}
    #myLogo{width:60px;height:40px;position:absolute;right:5px;top:10px;z-index:100;opacity:.8}
    #back-btn{
      position:absolute;top:16px;left:16px;z-index:500;
      background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);
      color:#fff;padding:8px 18px;border-radius:30px;
      font-size:13px;font-weight:700;cursor:pointer;
      display:none;align-items:center;gap:6px;transition:.2s;
    }
    #back-btn:hover{background:rgba(37,99,235,.8)}
    #back-btn.visible{display:flex}

    /* Shaka seek bar colors */
    .youtube-theme .shaka-seek-bar{background:rgba(255,255,255,.2)!important}
    .youtube-theme .shaka-buffered-range{background:rgba(255,255,255,.4)!important}
    .youtube-theme .shaka-played-range{background:rgb(255,0,0)!important}
    .shaka-spinner-container,.shaka-spinner,.shaka-spinner-svg{display:none!important}
  </style>
</head>
<body>

  <div id="quality-screen">
    <div class="qs-header">
      <div class="qs-logo">⚡ FANCODE</div>
      <div id="match-title" class="qs-title">Loading match...</div>
      <div id="match-tournament" class="qs-tournament"></div>
    </div>
    <div id="quality-list" class="qs-list">
      <div class="qs-loading">⏳ Fetching stream data...</div>
    </div>
  </div>

  <div id="player-screen">
    <div class="video-container">
      <div class="shaka-video-container youtube-theme" data-shaka-player>
        <video id="video" autoplay muted playsinline preload="auto"></video>
        <img id="myLogo" src="https://i.postimg.cc/fRSw4ZRD/IMG-20250925-223757.jpg">
      </div>
    </div>
    <button id="back-btn" onclick="showQualityScreen()">← Quality</button>
  </div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json";
const matchId = parseInt(new URLSearchParams(window.location.search).get("id"));
const video = document.getElementById("video");
let player = null;

function qualityBadge(res) {
  if (res >= 1080) return `<span class="badge fhd">${res}p</span>`;
  if (res >= 720)  return `<span class="badge hd">${res}p</span>`;
  return `<span class="badge">${res}p</span>`;
}

function parseQualities(m3u8Text) {
  const lines = m3u8Text.split("\n");
  const qualities = [];
  lines.forEach((line, i) => {
    if (line.includes("RESOLUTION=")) {
      const height = parseInt(line.split("RESOLUTION=")[1].split(",")[0].split("x")[1]);
      const fps = line.includes("FRAME-RATE=50") ? "50fps" : "25fps";
      const url = (lines[i + 1] || "").trim();
      if (url) qualities.push({ height, fps, url });
    }
  });
  return qualities.sort((a, b) => b.height - a.height);
}

function renderQualities(qualities) {
  const list = document.getElementById("quality-list");
  list.innerHTML = "";
  if (!qualities.length) {
    list.innerHTML = `<div class="qs-error">❌ No streams available.</div>`;
    return;
  }
  qualities.forEach(q => {
    const btn = document.createElement("div");
    btn.className = "qs-btn";
    btn.innerHTML = `
      <span>▶ ${q.height}p ${q.fps === "50fps" ? "<small style='color:#94a3b8;font-weight:500'> · 50fps</small>" : ""}</span>
      ${qualityBadge(q.height)}
    `;
    btn.onclick = () => startPlayer(q.url);
    list.appendChild(btn);
  });
}

async function loadMatch() {
  if (!matchId) { showError("No match ID provided."); return; }
  try {
    const res = await fetch(DATA_URL);
    const data = await res.json();
    const match = (data.matches || []).find(m => m.match_id === matchId);
    if (!match) { showError(`Match ID ${matchId} not found.`); return; }

    document.getElementById("match-title").textContent = match.title;
    document.getElementById("match-tournament").textContent = match.tournament;

    const streamAuto = match.auto_streams?.[0]?.auto || "";
    if (!streamAuto) { showError("Stream not available."); return; }

    renderQualities(parseQualities(streamAuto));
  } catch {
    showError("Failed to load match data. Please try again.");
  }
}

function showError(msg) {
  document.getElementById("match-title").textContent = "Error";
  document.getElementById("quality-list").innerHTML = `<div class="qs-error">❌ ${msg}</div>`;
}

async function startPlayer(streamUrl) {
  document.getElementById("quality-screen").classList.add("hidden");
  document.getElementById("player-screen").classList.add("visible");
  document.getElementById("back-btn").classList.add("visible");

  if (player) { await player.destroy(); player = null; }

  try {
    player = new shaka.Player();
    await player.attach(video);

    const ui = new shaka.ui.Overlay(player, document.querySelector(".shaka-video-container"), video);
    ui.configure({
      seekBarColors: { base: "rgba(255,255,255,.2)", buffered: "rgba(255,255,255,.4)", played: "rgb(255,0,0)" },
      controlPanelElements: ["play_pause","mute","time_and_duration","spacer","quality","picture_in_picture","fullscreen","overflow_menu"]
    });

    player.configure({
      streaming: { bufferingGoal: 10, rebufferingGoal: 2, bufferBehind: 30 }
    });

    video.muted = false;
    video.volume = 1;
    await player.load(streamUrl);
    try { await video.play(); } catch { video.muted = true; await video.play(); }

  } catch (err) {
    console.error("Player error:", err);
    video.src = streamUrl;
    try { await video.play(); } catch { video.muted = true; await video.play(); }
  }
}

function showQualityScreen() {
  if (player) { player.destroy(); player = null; }
  document.getElementById("player-screen").classList.remove("visible");
  document.getElementById("back-btn").classList.remove("visible");
  document.getElementById("quality-screen").classList.remove("hidden");
}

document.addEventListener("DOMContentLoaded", loadMatch);
</script>
</body>
</html>
